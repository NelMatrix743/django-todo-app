{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Django TODO App</title>

    <style>
    * {
    padding: 0px;
    margin: 0px;
    box-sizing: border-box;
    font-family: "consolas", sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 100px;
        background-color: #FAFAFA;
    }

    a, p {
        color: #4B5156;
    }

    .container {
        width: 50vw;
        margin: auto;
        gap: 50px 50px;
        background-color: #ffffff;
        -webkit-box-shadow: 2px 2px 13px -4px rgba(0, 0, 0, 0.21);
        box-shadow: 2px 2px 13px -4px rgba(0, 0, 0, 0.21);
    }

    .header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: white;
        padding: 10px;
        border-radius: 5px 5px 0 0;
        background: #206083;
    }

    .greet-section {
        display: flex;
        flex-direction: column;
        gap: 30px;
    }

    .authentication {
        background: #206083;
        color: white;
        border: 2px solid white;
        border-radius: 5px;
        padding: 5px 40px;
        font-weight: 600;
    }

    .authentication:active {
        background: white;
        color: #206083;
        border: none;
        transition: 1s;
    }


    .main-section {
        padding: 10px 20px;
    }

    .task-wrapper {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
    }

    .btn-img {
        width: 20px;
        height: 20px;
    }

    .actions-container {
        display: flex;
        gap: 10px;
    }

    </style>
</head>
<body>
    
    <main class="container">

        {% block content %}

        {% endblock content %}

    </main>

</body>
</html>
