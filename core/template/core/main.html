{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Django TODO App</title>

    <style>
    * {
    padding: 0px;
    margin: 0px;
    box-sizing: border-box;
    font-family: "consolas", sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 100px;
        background-color: #FAFAFA;
    }

    a, p {
        color: #4B5156;
    }

    .container {
        width: 50vw;
        margin: auto;
        gap: 50px 50px;
        background-color: #ffffff;
        -webkit-box-shadow: 2px 2px 13px -4px rgba(0, 0, 0, 0.21);
        box-shadow: 2px 2px 13px -4px rgba(0, 0, 0, 0.21);
    }

    .header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: white;
        padding: 10px;
        border-radius: 5px 5px 0 0;
        background: #206083;
    }

    input[type=text],
    input[type=password],
    textarea {
        width: 90%;
        border: 1px solid #206083;
        border-radius: 5px;
        padding: 10px;
    }

    label {
        padding-top: 10px !important;
        display: block;
    }

    .header-bar {
        display: flex;
        align-items: center;
        color: white;
        padding: 10px;
        border-radius: 5px 5px 0 0;
        background: #206083;
    }

    .header-bar a {
        color: white;
        text-decoration: none;
        margin-right: 18%;
        margin-left: 10px;
    }

    .task-creation-container {
        display: flex;
        flex-direction: column;
        margin: 20px 30px;
        gap: 20px;
    }

    .task-creation-container form {
        display: flex;
        flex-direction: column;
    }

    .task-creation-container form input {
        width: 100%;
    }


    .task-creation-container form textarea {
        width: 100%;
    }




    /* CSS STYLE RULES FOR MAIN APP SECTION */

    .greet-section {
        display: flex;
        flex-direction: column;
        gap: 30px;
    }

    .authentication {
        background: #206083;
        color: white;
        border: 2px solid white;
        border-radius: 5px;
        padding: 5px 40px;
        font-weight: 600;
    }

    .authentication:active {
        background: white;
        color: #206083;
        border: none;
        transition: 1s;
    }


    .main-section {
        padding: 10px 20px;
    }

    .search-interface {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 15px;
    }

    .search-interface form {
        display: flex;
        width: 100%;
    }

    .search-interface form input {
        width: 90%;
        padding: 10px 20px;
        background: #EFEFEF;
        border: none;
        border-top-left-radius: 30px;
        border-bottom-left-radius: 30px;
    }

    .search-interface form button {
        width: 10%;
        background: #206083;
        color: white;
        border: none;
        border-top-right-radius: 30px;
        border-bottom-right-radius: 30px;
    }

    .search-interface form button img {
        width: 20px;
    }

    .add-task {
        display: inline-flex;
        gap: 10px;
        text-decoration: none;
        background: #206083;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
    }

    .add-task img {
        width: 20px;
    }

    .task-items-container {
        margin-top: 20px;
    }

    .task-wrapper {
        display: flex;
        justify-content: space-between;
        padding-top: 20px;
        margin-bottom: 20px;
        border-top: 1px solid #206083;
    }

    .btn-img {
        width: 20px;
        height: 20px;
    }

    .actions-container {
        display: flex;
        gap: 10px;
    }

    .completion-icon-title {
        display: flex;
        gap: 10px;
    }

    .task-completion-icon {
        width: 20px;
        height: 20px;
        background-color: greenyellow;
        border-radius: 30%;
    }

    .task-incompletion-icon {
        width: 20px;
        height: 20px;
        background-color: grey;
        border-radius: 30%;
    }

    </style>
</head>
<body>
    
    <main class="container">

        {% block content %}

        {% endblock content %}

    </main>

</body>
</html>
